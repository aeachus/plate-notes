<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Plate Notes">
<meta name="theme-color" content="#f5f0e8">
<title>Plate Notes</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,700;9..144,800&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f0e8;--card:#fefcf9;--border:#e2dbd0;
  --accent:#bf5b2e;--accent-dark:#a34d24;--accent-light:#fdf0e6;
  --green:#5a8a5e;--green-light:#eaf3ea;--yellow:#c89f3c;--yellow-light:#fdf6e3;--red:#c45c5c;--red-light:#fde8e8;
  --text:#3a2e22;--text2:#6b5e52;--text3:#9a8c7e;--text4:#b8ada2;
  --input:#faf7f2;--font-d:'Fraunces',Georgia,serif;--font-b:'Outfit',sans-serif;
  --r:12px;--rl:16px;--sh:0 1px 4px rgba(58,46,34,.06);--shm:0 4px 14px rgba(58,46,34,.1);
}
html{height:100%;-webkit-text-size-adjust:100%}
body{font-family:var(--font-b);background:var(--bg);color:var(--text);min-height:100%;-webkit-font-smoothing:antialiased}
.app{max-width:480px;margin:0 auto;padding:0 16px 100px;min-height:100vh}
.hdr{padding:24px 0 16px;border-bottom:1.5px solid var(--border);margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.hdr h1{font-family:var(--font-d);font-size:28px;font-weight:800;color:var(--text);letter-spacing:-.3px}
.hdr-sub{font-size:12px;color:var(--text3);margin-top:1px;letter-spacing:.2px}
.hdr-icons{display:flex;gap:6px}
.hdr-icon{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;transition:all .12s}
.hdr-icon:active{background:var(--accent-light);border-color:var(--accent)}
.nav{display:flex;gap:4px;margin-bottom:16px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
.nav::-webkit-scrollbar{display:none}
.nav-tab{padding:8px 14px;border-radius:20px;font-size:13px;font-weight:500;white-space:nowrap;cursor:pointer;border:1.5px solid var(--border);background:var(--card);color:var(--text2);transition:all .12s}
.nav-tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.br{display:flex;gap:8px;margin-bottom:14px}
.b{padding:11px 20px;border-radius:var(--r);border:none;cursor:pointer;font-family:var(--font-b);font-size:14px;font-weight:600;transition:all .12s;text-align:center;-webkit-tap-highlight-color:transparent}
.bp{background:var(--accent);color:#fff}.bp:active{background:var(--accent-dark)}
.bo{background:transparent;border:1.5px solid var(--accent);color:var(--accent)}.bo:active{background:var(--accent-light)}
.bg{background:transparent;color:var(--text3);border:none;padding:8px 0;font-weight:500;cursor:pointer;font-family:var(--font-b);font-size:14px}
.bw{width:100%}.f1{flex:1}.bs{padding:7px 14px;font-size:13px}
.inp,.sel,.ta{width:100%;padding:10px 14px;border-radius:10px;border:1.5px solid var(--border);font-family:var(--font-b);font-size:14px;color:var(--text);background:var(--input);outline:none;margin-bottom:10px;-webkit-appearance:none;transition:border-color .12s}
.inp:focus,.sel:focus,.ta:focus{border-color:var(--accent)}
.ta{min-height:60px;resize:vertical;line-height:1.5}
.sel{padding-right:32px;background-image:url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l5 5 5-5' stroke='%239a8c7e' stroke-width='1.5' fill='none'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 12px center}
.lbl{display:block;font-size:11px;font-weight:600;color:var(--text2);margin-bottom:5px;margin-top:14px;text-transform:uppercase;letter-spacing:.6px}
.cd{background:var(--card);border-radius:var(--rl);padding:14px 16px;border:1px solid var(--border);margin-bottom:10px;box-shadow:var(--sh);animation:fi .2s ease-out}
.cd-tap{cursor:pointer}.cd-tap:active{box-shadow:var(--shm)}
.fc{background:var(--card);border-radius:var(--rl);padding:20px;border:1px solid var(--border);box-shadow:var(--shm);animation:fi .2s ease-out;margin-bottom:16px}
.ch{display:flex;justify-content:space-between;align-items:flex-start}
.ct{font-family:var(--font-d);font-size:17px;font-weight:700;color:var(--text);line-height:1.3}
.cs{font-size:12px;color:var(--text3);margin-top:2px}
.cdt{font-size:11px;color:var(--text4);margin-top:1px}
.ft{font-family:var(--font-d);font-size:22px;font-weight:700;color:var(--text);margin-bottom:10px}
.pls{display:flex;flex-wrap:wrap;gap:6px}
.pl{padding:6px 13px;border-radius:20px;border:1.5px solid var(--border);background:var(--input);color:var(--text2);font-family:var(--font-b);font-size:13px;cursor:pointer;transition:all .12s;white-space:nowrap}
.pl.on{border-color:var(--accent);background:var(--accent-light);color:var(--accent);font-weight:600}
.tgs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tg{display:inline-flex;align-items:center;padding:4px 10px;border-radius:8px;font-size:12px;font-weight:500;border:1px solid var(--border);color:var(--text2);background:var(--input);white-space:nowrap}
.tg-sm{padding:2px 8px;border-radius:6px;font-size:11px;font-weight:500;border:1px solid var(--border);color:var(--text3);background:var(--input);display:inline-block}
.tg-grn{border-color:var(--green);color:var(--green);background:var(--green-light)}
.tg-ylw{border-color:var(--yellow);color:var(--yellow);background:var(--yellow-light)}
.tg-red{border-color:var(--red);color:var(--red);background:var(--red-light)}
.plr{display:flex;gap:2px;align-items:center;margin-top:4px;flex-wrap:wrap}
.plr-b{background:none;border:none;cursor:pointer;font-size:22px;padding:1px;transition:all .1s}
.plr-b.dim{filter:grayscale(1) opacity(.2)}
.or{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ob{padding:8px 14px;border-radius:var(--r);cursor:pointer;transition:all .12s;border:1.5px solid var(--border);background:var(--input);font-size:13px;font-family:var(--font-b);color:var(--text2)}
.ob.on{border-color:var(--accent);background:var(--accent-light);color:var(--accent);font-weight:600}
.sh{font-family:var(--font-d);font-size:15px;font-weight:600;color:var(--text)}
.sh2{font-size:12px;color:var(--text3);margin-left:8px;font-family:var(--font-b)}
.sb{margin:16px 0 6px}
.ib{background:none;border:none;cursor:pointer;font-size:14px;padding:4px;border-radius:6px;opacity:.5;transition:opacity .12s}.ib:active{opacity:1}
.ibs{display:flex;gap:6px}
.nt{margin-top:6px;font-size:13px;color:var(--text2);line-height:1.5;font-style:italic}
.emp{text-align:center;padding:40px 20px;color:var(--text4)}
.emp-i{font-size:40px;margin-bottom:12px}
.emp-t{font-family:var(--font-d);font-size:18px;color:var(--text2);margin-bottom:6px}
.sm{background:none;border:none;color:var(--accent);font-size:12px;font-family:var(--font-b);cursor:pointer;margin-top:6px;padding:0}
.bf{display:flex;gap:10px;margin-top:18px}
.who{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.who-b{padding:8px 16px;border-radius:24px;font-size:13px;font-weight:500;cursor:pointer;border:1.5px solid var(--border);background:var(--card);color:var(--text2);transition:all .12s}
.who-b.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.rand-card{background:var(--card);border-radius:20px;padding:24px;border:1px solid var(--border);box-shadow:var(--shm);text-align:center;margin:20px 0;animation:rs .4s ease-out}
.rand-name{font-family:var(--font-d);font-size:24px;font-weight:800;color:var(--text);margin-bottom:4px}
.rand-meta{font-size:13px;color:var(--text3)}
@keyframes rs{0%{transform:scale(.9);opacity:.3}50%{transform:scale(1.03)}100%{transform:scale(1);opacity:1}}
.bo-rank{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-size:13px;font-weight:700;margin-right:10px;flex-shrink:0}
.share-card{background:linear-gradient(135deg,#3a2e22 0%,#5a4535 100%);border-radius:20px;padding:24px;color:#fff;margin:16px 0}
.share-card h3{font-family:var(--font-d);font-size:20px;font-weight:700;margin-bottom:4px}
.share-card .sc-meta{font-size:12px;opacity:.7;margin-bottom:14px}
.share-card .sc-dish{background:rgba(255,255,255,.12);border-radius:10px;padding:10px 14px;margin-bottom:6px}
.share-card .sc-dn{font-weight:600;font-size:14px}
.share-card .sc-info{font-size:12px;opacity:.8;margin-top:2px}
.vb{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:12px;background:var(--accent-light);color:var(--accent);font-size:12px;font-weight:600}
.person-section{background:var(--input);border-radius:var(--r);padding:14px;margin-bottom:10px;border:1px solid var(--border)}
.person-section .ps-name{font-family:var(--font-d);font-size:15px;font-weight:600;color:var(--text);margin-bottom:8px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 24px;border-radius:24px;font-size:13px;font-weight:500;font-family:var(--font-b);box-shadow:0 4px 16px rgba(0,0,0,.18);z-index:100;animation:ti .3s ease-out;pointer-events:none}
@keyframes ti{from{opacity:0;transform:translateX(-50%) translateY(12px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.sync{position:fixed;top:12px;right:12px;padding:4px 12px;border-radius:16px;font-size:11px;font-weight:500;font-family:var(--font-b);z-index:99;animation:fi .2s}
.sync-ok{background:var(--green-light);color:var(--green)}
.sync-err{background:var(--red-light);color:var(--red)}
.sync-ing{background:var(--yellow-light);color:var(--yellow)}
.search-results{background:var(--card);border:1.5px solid var(--border);border-radius:10px;margin:-6px 0 10px;max-height:200px;overflow-y:auto}
.search-result{padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border);font-size:13px}
.search-result:last-child{border-bottom:none}
.search-result:active{background:var(--accent-light)}
.search-result .sr-name{font-weight:600;color:var(--text)}
.search-result .sr-addr{color:var(--text3);font-size:12px;margin-top:2px}
.search-loading{padding:12px;text-align:center;color:var(--text3);font-size:13px}
.web-link{color:var(--accent);text-decoration:none;font-size:13px;word-break:break-all}
.web-link:hover{text-decoration:underline}
.list-item{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--input);border:1px solid var(--border);border-radius:8px;margin-bottom:6px;font-size:13px}
.list-item .li-name{flex:1;color:var(--text)}
.list-item .li-btn{background:none;border:none;cursor:pointer;font-size:12px;padding:2px 6px;border-radius:4px;color:var(--text3)}
.list-item .li-btn:active{color:var(--accent)}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
// ============================================================
// CONFIG & STATE
// ============================================================
var STORAGE_KEY="plate-notes",API_STORAGE="plate-notes-api";
var BASE_NEIGHBORHOODS=["Balboa Park","Banker's Hill","Barrio Logan","Bay Park","Bird Rock","Carlsbad","Carmel Valley","Chula Vista","City Heights","Clairemont","College Area","Coronado","Del Mar","Downtown","East Village","Encinitas","Escondido","Gaslamp Quarter","Golden Hill","Hillcrest","Imperial Beach","Kearny Mesa","Kensington","La Jolla","La Mesa","Liberty Station","Linda Vista","Little Italy","Mira Mesa","Miramar","Mission Bay","Mission Beach","Mission Hills","Mission Valley","Normal Heights","North Park","OB (Ocean Beach)","Old Town","Pacific Beach","Point Loma","Poway","Rancho Bernardo","Rancho Peñasquitos","Rolando","San Marcos","San Ysidro","Scripps Ranch","Serra Mesa","Shelter Island","Solana Beach","Sorrento Valley","South Park","Talmadge","Tierrasanta","University City","University Heights","Vista","Other"];
var BASE_STYLES=["American","BBQ","Bakery/Café","Brazilian","Brunch","Burmese","Cajun/Creole","Caribbean","Chinese","Colombian","Deli/Sandwich","Dim Sum","Ethiopian","Filipino","Fine Dining","French","Gastropub","Greek","Hawaiian/Poke","Indian","Italian","Japanese","Korean","Latin Fusion","Lebanese/Middle Eastern","Malaysian","Mediterranean","Mexican","Moroccan","Neapolitan Pizza","Peruvian","Ramen","Seafood","Southern","Spanish/Tapas","Sushi","Szechuan","Tacos","Thai","Vegan/Vegetarian","Vietnamese","Other"];
var BASE_FLAVORS=["Savory","Smoky","Spicy","Sweet","Tangy"];
var DTAGS=["Appetizer","Dessert","Drink","Entrée","Shared Plate","Side"];
var OA=[{l:"Yes",e:"👍",c:"tg-grn"},{l:"Maybe",e:"🤷",c:"tg-ylw"},{l:"No",e:"👎",c:"tg-red"}];

var D={restaurants:[],dishes:[],people:[],wishlist:[],visits:[],customFlavors:[],customNeighborhoods:[],customStyles:[],customDishTags:[]};
var V={view:"home",tab:"spots",sel:null,edit:null,search:"",fN:"",fS:"",who:null,whoFriends:[],restSort:"date",api:null};

// Merged list getters
function allFlavors(){var base=BASE_FLAVORS.slice();D.customFlavors.forEach(function(f){if(base.indexOf(f)<0)base.push(f);});return base;}
function allNeighborhoods(){var base=BASE_NEIGHBORHOODS.slice();D.customNeighborhoods.forEach(function(n){if(base.indexOf(n)<0)base.push(n);});return base.sort();}
function allStyles(){var base=BASE_STYLES.slice();D.customStyles.forEach(function(s){if(base.indexOf(s)<0)base.push(s);});return base.sort();}

function dedup(){var seen={};D.people=D.people.filter(function(p){var k=p.name+"|"+p.type;if(seen[k])return false;seen[k]=true;return true;});}
function load(){try{var r=localStorage.getItem(STORAGE_KEY);if(r){var d=JSON.parse(r);D=Object.assign(D,d);}}catch(e){}
V.api=localStorage.getItem(API_STORAGE)||null;dedup();
if(!D.people.length)D.people=[{id:gid(),name:"Alisha",type:"core"},{id:gid(),name:"Shawn",type:"core"}];
var hasA=D.people.some(function(p){return p.name==="Alisha"&&p.type==="core";});
var hasS=D.people.some(function(p){return p.name==="Shawn"&&p.type==="core";});
if(!hasA)D.people.unshift({id:gid(),name:"Alisha",type:"core"});
if(!hasS)D.people.push({id:gid(),name:"Shawn",type:"core"});
dedup();migrateRatings();migrateStyles();migratePlateScores();save();}
function migrateRatings(){
// Build a map of current person IDs
var idSet={};D.people.forEach(function(p){idSet[p.id]=true;});
// Build name->id lookup for matching
var nameToId={};D.people.forEach(function(p){nameToId[p.name.toLowerCase()]=p.id;});
// Check each dish's ratings
var fixed=0;
D.dishes.forEach(function(d){
if(!d.ratings)return;
var newRatings={};var needsFix=false;
for(var key in d.ratings){
if(idSet[key]){newRatings[key]=d.ratings[key];}
else{
// Try to match by name fragment in the key
var matched=false;
for(var name in nameToId){
if(key.toLowerCase().indexOf(name)>=0){
newRatings[nameToId[name]]=d.ratings[key];matched=true;fixed++;break;}}
if(!matched)newRatings[key]=d.ratings[key];
needsFix=true;}}
if(needsFix)d.ratings=newRatings;
});
if(fixed)console.log("Migrated "+fixed+" rating entries to current people IDs");}
function migrateStyles(){
var tags={
"mandarin wok":["Chinese"],
"poppy boba kitchen":["Bakery/Café"],
"steamy piggy":["Chinese","Dim Sum","Ramen"],
"wing stop":["American","BBQ"],
"cheesecake factory":["American","Fine Dining"],
"monsta ramen curry":["Japanese","Ramen"],
"lupe's mexican eatery":["Mexican","Tacos"],
"mic drop comedy":["American","Gastropub"],
"chili's":["American","Mexican"],
"crispy burger":["American"],
"sushi deli 3":["Japanese","Sushi"],
"coronado brewing morena":["American","Gastropub"]
};
D.restaurants.forEach(function(r){
if(r.styles&&r.styles.length)return;
var key=r.name.toLowerCase();
if(tags[key])r.styles=tags[key].slice();
});}
function migratePlateScores(){
D.dishes.forEach(function(d){
if(!d.ratings)return;
for(var k in d.ratings){
if(d.ratings[k].ps>5){d.ratings[k].ps=Math.round(d.ratings[k].ps/2);}
}});}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(D));}catch(e){}}
function gid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function td(){return new Date().toISOString().split("T")[0]}
function fd(d){if(!d)return"";return new Date(d+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})}
function esc(s){if(!s)return"";return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function toast(m){var e=document.createElement("div");e.className="toast";e.textContent=m;document.body.appendChild(e);setTimeout(function(){e.remove()},2200)}
function core(){return D.people.filter(function(p){return p.type==="core";})}
function friends(){return D.people.filter(function(p){return p.type==="friend";})}
function pn(id){var p=D.people.find(function(x){return x.id===id;});return p?p.name:"?";}
function rdish(rid){return D.dishes.filter(function(d){return d.rid===rid;});}
function rvis(rid){return D.visits.filter(function(v){return v.rid===rid;});}

// ---- API ----
async function api(action,body){if(!V.api)return null;showSync("ing");
try{var r=await fetch(V.api+"?action="+action,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify(body||{}),redirect:"follow"});var d=await r.json();if(d.error){showSync("err");return null;}showSync("ok");return d;}catch(e){showSync("err");return null;}}
async function syncFrom(){var d=await api("getAll");if(d){
D.restaurants=(d.restaurants||[]).map(function(r){return{id:r.id,name:r.name,address:r.address,neighborhood:r.neighborhood,styles:typeof r.styles==="string"?tryP(r.styles,[]):r.styles||[],website:r.website||""};});
D.dishes=(d.dishes||[]).map(function(x){return{id:x.id,rid:x.restaurantId,dishName:x.dishName,date:x.date,dishTag:x.dishTag,ratings:typeof x.ratings==="string"?tryP(x.ratings,{}):x.ratings||{}};});
D.people=(d.people||[]).map(function(x){return{id:x.id,name:x.name,type:x.type};});
D.wishlist=(d.wishlist||[]).map(function(x){return{id:x.id,wt:x.wishType,name:x.name,rn:x.restaurantName,addr:x.address||"",hood:x.neighborhood||"",wstyles:typeof x.styles==="string"?tryP(x.styles,[]):x.styles||[],web:x.website||"",rb:x.recommendedBy,notes:x.notes,tried:x.tried==="true"||x.tried===true};});
D.visits=(d.visits||[]).map(function(x){return{id:x.id,rid:x.restaurantId,date:x.date,pids:typeof x.peopleIds==="string"?tryP(x.peopleIds,[]):x.peopleIds||[]};});
// Custom lists
if(d.customLists&&d.customLists.length){d.customLists.forEach(function(cl){
var vals=typeof cl.values==="string"?tryP(cl.values,[]):cl.values||[];
if(cl.listType==="flavors")D.customFlavors=vals;
if(cl.listType==="neighborhoods")D.customNeighborhoods=vals;
if(cl.listType==="styles")D.customStyles=vals;});}
dedup();migrateRatings();migrateStyles();migratePlateScores();save();R();}}
function tryP(s,def){try{return JSON.parse(s)}catch(e){return def}}
function syncPush(action,data){api(action,data);}
function showSync(t){document.querySelectorAll(".sync").forEach(function(e){e.remove()});var e=document.createElement("div");e.className="sync sync-"+t;e.textContent=t==="ok"?"✓ Synced":t==="err"?"✗ Sync error":"↻ Syncing...";document.body.appendChild(e);setTimeout(function(){e.remove()},t==="ok"?1500:3000);}

// ---- Place Search ----
async function searchPlaceAPI(query){
if(!V.api){toast("Set up Google Sheets sync first to use search");return[];}
var d=await api("searchPlace",{query:query});
return d&&d.results?d.results:[];}
// ---- RENDER ----
function capForm(){
if((V.view==="addD"||V.view==="editD")&&window._d){
var n=document.getElementById("dN");if(n)window._d.dn=n.value;
var dt=document.getElementById("dDt");if(dt)window._d.dd=dt.value;
var rs=document.getElementById("dR");if(rs)window._d.rid=rs.value;var rsr=document.getElementById("dRsearch");if(rsr)window._d.rSearch=rsr.value;
var coreRaters=V.who==="tog"?core():D.people.filter(function(p){return p.id===V.who;});var friendRaters=D.people.filter(function(p){return V.whoFriends.indexOf(p.id)>=0;}).sort(function(a,b){return a.name.localeCompare(b.name);});var raters=coreRaters.concat(friendRaters);
raters.forEach(function(p){var ta=document.getElementById("dn_"+p.id);if(ta&&window._d.rt[p.id])window._d.rt[p.id].notes=ta.value;});
}
if((V.view==="addR"||V.view==="editR")&&window._rf){

function sortDishes(ds){
var s=V.restSort||"date";
var alishaId=(core().find(function(p){return p.name==="Alisha";})||{}).id||"";
var shawnId=(core().find(function(p){return p.name==="Shawn";})||{}).id||"";
var oaOrder={"Yes":0,"Maybe":1,"No":2,"":3};
switch(s){
case"date":ds.sort(function(a,b){return(b.date||"").localeCompare(a.date||"");});break;
case"rating":ds.sort(function(a,b){
var aMax=0,bMax=0;for(var k in(a.ratings||{}))aMax=Math.max(aMax,a.ratings[k].ps||0);for(var k in(b.ratings||{}))bMax=Math.max(bMax,b.ratings[k].ps||0);return bMax-aMax;});break;
case"az":ds.sort(function(a,b){return(a.dishName||"").localeCompare(b.dishName||"");});break;
case"alisha":ds.sort(function(a,b){var ap=a.ratings&&a.ratings[alishaId]?a.ratings[alishaId].ps||0:0;var bp=b.ratings&&b.ratings[alishaId]?b.ratings[alishaId].ps||0:0;return bp-ap;});break;
case"shawn":ds.sort(function(a,b){var ap=a.ratings&&a.ratings[shawnId]?a.ratings[shawnId].ps||0:0;var bp=b.ratings&&b.ratings[shawnId]?b.ratings[shawnId].ps||0:0;return bp-ap;});break;
case"together":ds.sort(function(a,b){
var aAvg=0,aC=0,bAvg=0,bC=0;
for(var k in(a.ratings||{})){if(a.ratings[k].ps){aAvg+=a.ratings[k].ps;aC++;}}
for(var k in(b.ratings||{})){if(b.ratings[k].ps){bAvg+=b.ratings[k].ps;bC++;}}
return(bC?bAvg/bC:0)-(aC?aAvg/aC:0);});break;
case"dishtype":var courseOrder={"Drink":0,"Entrée":1,"Appetizer":2,"Dessert":3,"Side":4,"Shared Plate":5};
ds.sort(function(a,b){var aO=courseOrder[a.dishTag]!==undefined?courseOrder[a.dishTag]:6;var bO=courseOrder[b.dishTag]!==undefined?courseOrder[b.dishTag]:6;if(aO!==bO)return aO-bO;return(a.dishTag||"zzz").localeCompare(b.dishTag||"zzz");});break;

case"orderagain":ds.sort(function(a,b){
function bestOa(d){var best=3;for(var k in(d.ratings||{})){var oa=d.ratings[k].oa;var rank=oa==="Yes"?0:oa==="Maybe"?1:oa==="No"?2:3;if(rank<best)best=rank;}return best;}
return bestOa(a)-bestOa(b);});break;
default:
if(s.indexOf("flavor_")===0){var targetFlavor=s.slice(7);
ds.sort(function(a,b){
function hasFlavor(d,f){for(var k in(d.ratings||{})){if(d.ratings[k].fl&&d.ratings[k].fl.indexOf(f)>=0)return true;}return false;}
var aHas=hasFlavor(a,targetFlavor)?0:1;var bHas=hasFlavor(b,targetFlavor)?0:1;
if(aHas!==bHas)return aHas-bHas;
var aMax=0,bMax=0;for(var k in(a.ratings||{}))aMax=Math.max(aMax,a.ratings[k].ps||0);for(var k in(b.ratings||{}))bMax=Math.max(bMax,b.ratings[k].ps||0);return bMax-aMax;});}
break;
}}

function openEditList(type){V.editListType=type;V.view="editList";R();}
function addListItem(){var inp=document.getElementById("newListItem");var v=inp.value.trim();if(!v)return;
var type=V.editListType;var custom=type==="flavors"?D.customFlavors:type==="neighborhoods"?D.customNeighborhoods:D.customStyles;
var all=type==="flavors"?allFlavors():type==="neighborhoods"?allNeighborhoods():allStyles();
if(all.indexOf(v)>=0){toast("Already exists!");return;}
custom.push(v);save();syncCustomLists();toast("Added!");R();}
function removeListItem(item){if(!confirm('Remove "'+item+'"?'))return;
var type=V.editListType;
var base=type==="flavors"?BASE_FLAVORS:type==="neighborhoods"?BASE_NEIGHBORHOODS:BASE_STYLES;
var customKey=type==="flavors"?"customFlavors":type==="neighborhoods"?"customNeighborhoods":"customStyles";
// If it's a base item, add to custom as a removal marker? No, simpler: just add to a "removed" concept
// Actually simplest: for base items, we add them to custom and then remove. But base items aren't in custom.
// Let's just: if it's a custom item, remove from custom. If it's a base item, we need a "removed" list.
// For simplicity, let's rebuild: make custom = full override list
if(D[customKey].indexOf(item)>=0){
  D[customKey]=D[customKey].filter(function(x){return x!==item;});
} else {
  // It's a base item. We need to track removed base items. Let's use a negative approach:
  // Store all items as the custom list (override base entirely when custom has items)
  // Actually let's just use a removed list
  if(!D["removed_"+type])D["removed_"+type]=[];
  D["removed_"+type].push(item);
}
save();syncCustomLists();toast("Removed!");R();}
function renameListItem(item){var newName=prompt('Rename "'+item+'" to:',item);
if(!newName||newName.trim()===item)return;newName=newName.trim();
var type=V.editListType;var customKey=type==="flavors"?"customFlavors":type==="neighborhoods"?"customNeighborhoods":"customStyles";
var idx=D[customKey].indexOf(item);
if(idx>=0){D[customKey][idx]=newName;}else{
  // Base item rename: remove base, add custom
  if(!D["removed_"+type])D["removed_"+type]=[];
  D["removed_"+type].push(item);
  D[customKey].push(newName);
}
// Update existing data that references old name
if(type==="flavors"){D.dishes.forEach(function(d){for(var k in(d.ratings||{})){var fl=d.ratings[k].fl||[];var fi=fl.indexOf(item);if(fi>=0)fl[fi]=newName;}});}
if(type==="neighborhoods"){D.restaurants.forEach(function(r){if(r.neighborhood===item)r.neighborhood=newName;});}
if(type==="styles"){D.restaurants.forEach(function(r){var si=(r.styles||[]).indexOf(item);if(si>=0)r.styles[si]=newName;});}
save();syncCustomLists();toast("Renamed!");R();}
function syncCustomLists(){syncPush("saveCustomLists",{flavors:D.customFlavors,neighborhoods:D.customNeighborhoods,styles:D.customStyles});}

// Override merged list getters to account for removals
function sortOtherLast(arr){var other=arr.filter(function(x){return x.toLowerCase()==="other"||x.toLowerCase()==="custom";});var rest=arr.filter(function(x){return x.toLowerCase()!=="other"&&x.toLowerCase()!=="custom";});rest.sort(function(a,b){return a.localeCompare(b);});return rest.concat(other);}
var _origAllFlavors=allFlavors;
allFlavors=function(){var removed=D.removed_flavors||[];var base=BASE_FLAVORS.filter(function(x){return removed.indexOf(x)<0;});D.customFlavors.forEach(function(f){if(base.indexOf(f)<0)base.push(f);});return sortOtherLast(base);};
var _origAllNeighborhoods=allNeighborhoods;
allNeighborhoods=function(){var removed=D.removed_neighborhoods||[];var base=BASE_NEIGHBORHOODS.filter(function(x){return removed.indexOf(x)<0;});D.customNeighborhoods.forEach(function(n){if(base.indexOf(n)<0)base.push(n);});return sortOtherLast(base);};
var _origAllStyles=allStyles;
allStyles=function(){var removed=D.removed_styles||[];var base=BASE_STYLES.filter(function(x){return removed.indexOf(x)<0;});D.customStyles.forEach(function(s){if(base.indexOf(s)<0)base.push(s);});return sortOtherLast(base);};

var results=await searchPlaceAPI(n);
if(!results.length){area.innerHTML='<div class="search-loading">No results. You can type the name and pick from dropdown, or add a new restaurant first.</div>';return;}
area.innerHTML='<div class="search-results">'+results.map(function(r,i){
return'<div class="search-result" onclick="pickDishRest('+i+')"><div class="sr-name">'+esc(r.name||n)+'</div><div class="sr-addr">'+esc(r.address)+'</div></div>';
}).join('')+'</div>';
window._dishRestResults=results;}

function pickDishRest(i){
var r=window._dishRestResults[i];if(!r)return;
var searchName=(r.name||document.getElementById("dRsearch").value).trim();
// Check if we already have this restaurant
var existing=D.restaurants.find(function(x){return x.name.toLowerCase()===searchName.toLowerCase();});
if(existing){
window._d.rid=existing.id;window._d.rSearch=existing.name;
// Update address if we got a better one
if(r.address&&!existing.address){existing.address=r.address;save();}
document.getElementById("dishRestResults").innerHTML='';
window._d.changingRest=false;toast("Selected: "+existing.name);R();return;}
// Create new restaurant
var nr={id:gid(),name:searchName,address:r.address||"",neighborhood:"",styles:[],website:""};
D.restaurants.push(nr);save();
syncPush("saveRestaurant",{id:nr.id,name:nr.name,address:nr.address,neighborhood:"",styles:"[]",website:""});
window._d.rid=nr.id;window._d.rSearch=nr.name;
document.getElementById("dishRestResults").innerHTML='';
window._d.changingRest=false;toast("Created & selected: "+nr.name);R();}

// ---- SEARCH FILTER (no re-render) ----
function filterCards(val){
V.search=val;
var cards=document.querySelectorAll('#restList .cd');
var q=val.toLowerCase();
var anyVisible=false;
cards.forEach(function(card){
var name=card.getAttribute('data-rname')||'';
var styles=card.getAttribute('data-rstyles')||'';
var match=!q||name.indexOf(q)>=0||styles.indexOf(q)>=0;
card.style.display=match?'':'none';
if(match)anyVisible=true;
});
}

// ---- INIT ----
load();R();
if(V.api)setTimeout(function(){syncFrom();},1000);
</script>
</body>
